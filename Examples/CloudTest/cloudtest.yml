# Agent-based CloudTest examples: BasicExample runs in production, and 1JS runs in PPE.
# The 1JS example uses scopes.json to schedule jobs for the test:e2e and test:component verbs,
# with inputs derived from the transitive closure of each corresponding pip's inputs.
# Docs: https://eng.ms/docs/more/developer-guides/cloudtest-user-guide/cloudtest/how-tos/setup-cloudtest-azuredevops-tasks
# Fileless TestMap: https://eng.ms/docs/cloud-ai-platform/developer-services/one-engineering-system-1es/cloudtest-user-guide/cloudtest/features/fileless-testmap

trigger: none

parameters:
  - name: useLocalBxl
    type: boolean
    default: false
    displayName: 'Build and use a locally-built BXL instead of the released version'
  - name: CTCacheEnabled
    type: boolean
    default: false
    displayName: 'Enable CloudTest session caching'

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    pool: 
      name: BuildXL-DevOpsAgents-Selfhost-BuildCache
      image: ubuntu-24.04-PME-GPT
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Windows-SDL-Agents
        os: windows
    stages:
    - stage: CloudTest
      dependsOn: []
      displayName: (PROD) Simple validation
      jobs:
      - template: /Examples/CloudTest/cloudtest-job.yml@self
        parameters:
          displayName: Simple validation
          exampleDirectory: Examples/CloudTest/BasicExample
          ServiceConnection: mseng-Domino-BuildXL-Pipelines # BuildXL identity used to acquire access tokens
          ServiceConnectionId: '861f8f3b-77a2-497a-a955-fbd921dc48de' # ID of mseng-Domino-BuildXL-Pipelines
          Resource: '499b84ac-1321-427f-aa17-267ca6975798' # Azure DevOps resource ID (feed and drop access)
          CloudTestResource: '77c466d9-b133-4a83-a8f5-c94133051e06' # CloudTest production API resource ID
          CloudTestServiceConnection: CloudTest-BuildXL-Prod # Monitors production sessions using BuildXL-owned resources
          cloudTestTenant: cloudtest-sample # BuildXL-owned production tenant
          useMonitoringTask: false # Wait for session completion inside the BuildXL graph. The monitoring is not working in PROD.
          CTCacheEnabled: ${{ parameters.CTCacheEnabled }}
          useLocalBxl: ${{ parameters.useLocalBxl }}
    - stage: CloudTest1JS
      dependsOn: []
      displayName: (PPE) 1JS-like validation
      jobs:
      - template: /Examples/CloudTest/cloudtest-job.yml@self
        parameters:
          displayName: 1JS-like validation
          exampleDirectory: Examples/CloudTest/1JS
          ServiceConnection: mseng-Domino-BuildXL-Pipelines # BuildXL identity used to acquire access tokens
          ServiceConnectionId: '861f8f3b-77a2-497a-a955-fbd921dc48de' # ID of mseng-Domino-BuildXL-Pipelines
          Resource: '499b84ac-1321-427f-aa17-267ca6975798' # Azure DevOps resource ID (feed and drop access)
          CloudTestResource: '7f37d4dd-3b7a-4344-b1ea-7e0c025e6924' # CloudTest PPE API resource ID
          CloudTestServiceConnection: CloudTest-INT # Monitors sessions in CloudTest's internal PPE environment
          cloudTestTenant: cloudtest # CloudTest internal tenant; ctest.dsc selects the PPE environment
          CTCacheEnabled: ${{ parameters.CTCacheEnabled }}
          useLocalBxl: ${{ parameters.useLocalBxl }}