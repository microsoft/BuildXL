# Agent-based CloudTest task example
# Docs: https://eng.ms/docs/more/developer-guides/cloudtest-user-guide/cloudtest/how-tos/setup-cloudtest-azuredevops-tasks
# Fileless TestMap: https://eng.ms/docs/cloud-ai-platform/developer-services/one-engineering-system-1es/cloudtest-user-guide/cloudtest/features/fileless-testmap

trigger: none

parameters:
  - name: ServiceConnection
    type: string
    default: 'mseng-Domino-BuildXL-Pipelines' # Service connection used by most BuildXL pipelines that need an authentication token
  - name: Resource
    type: string
    default: '499b84ac-1321-427f-aa17-267ca6975798' # Azure DevOps resource UUID
  - name: CloudTestResource
    type: string
    default: '77c466d9-b133-4a83-a8f5-c94133051e06' # CloudTest API resource ID

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    pool: 
      name: BuildXL-DevOpsAgents-Selfhost-BuildCache
      image: ubuntu-24.04-PME-GPT
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Windows-SDL-Agents
        os: windows
    stages:
    - stage: BuildXL
      dependsOn: []
      displayName: BuildXL-CloudTest
      jobs:
      - job: build
        displayName: Build JS repo + Run CloudTest
        templateContext:
          workflow: BuildXL   
          preBuildSteps:
          - task: microsoft-1es-production.entra-authenticate.entra-authenticate.EntraAuthenticate@0
            displayName: '🪙 Acquire access token for ${{ parameters.ServiceConnection }}'
            inputs:
              azureSubscription: ${{ parameters.ServiceConnection }}
              resource: ${{ parameters.Resource }}
              secretVariable: GeneratedAccessToken
          - task: microsoft-1es-production.entra-authenticate.entra-authenticate.EntraAuthenticate@0
            displayName: '🪙 Acquire CloudTest bearer token'
            inputs:
              azureSubscription: ${{ parameters.ServiceConnection }}
              resource: ${{ parameters.CloudTestResource }}
              secretVariable: CloudTestAccessToken
          - task: NodeTool@0
            inputs:
              versionSpec: '22.18.0'
            displayName: 'Install Node'
          - script: |
              npm config set registry https://cloudbuild.pkgs.visualstudio.com/_packaging/BuildXL.Selfhost/npm/registry/
              npm config set //cloudbuild.pkgs.visualstudio.com/_packaging/BuildXL.Selfhost/npm/registry/:_authToken=$FEED_TOKEN
              npm install -g yarn
            displayName: 'Install Yarn'
            env:
              FEED_TOKEN: $(GeneratedAccessToken)
          - script: yarn install
            displayName: 'Yarn Install'
            workingDirectory: $(Build.SourcesDirectory)/Examples/CloudTest
          buildXL:
            installerOptions:
              version: $(BuildXLPackageVersion)
            # 861f8f3b-77a2-497a-a955-fbd921dc48de is the service connection ID for mseng-Domino-BuildXL-Pipelines
            arguments: >-
              /c:config.dsc
              /logOutput:FullOutputAlways
              /p:CloudTestTokenVariableName=CloudTestAccessToken
              /p:ServiceConnectionId=861f8f3b-77a2-497a-a955-fbd921dc48de
            workingDirectory: $(Build.SourcesDirectory)/Examples/CloudTest
            env:
              CloudTestAccessToken: $(CloudTestAccessToken)
            cloudTestMonitoring:
              connectedServiceName: ${{ parameters.ServiceConnection }}
              cloudTestTenant: "cloudtest-sample"