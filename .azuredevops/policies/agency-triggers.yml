# metadata
name: Agency triggers configuration
description: Automatically review new pull requests

# filters
resource: repository

# primitive configuration
configuration:
    agencyTriggers:
    - eventTypes:
        - "PullRequestPublished"
        - "PullRequestCommitPublished"
      job:
          agent:
              name: "agency-code-review"
              pluginName: "agency-review"
              type: Company
          plugins:
              - name: "agency-review"
                type: Company
