trigger: none # Explicitly scheduled for PRs

jobs:
- job: buildAndTest
  displayName: Build and test BuildXL on macOS
  timeoutInMinutes: 120
  strategy:
    matrix:
      Debug:
        configurationArgument: ''
        qualifierArgument: '/q:DebugDotNetCoreMacArm64'
      Release:
        configurationArgument: '--release'
        qualifierArgument: '/q:ReleaseDotNetCoreMacArm64'
  pool:
    name: GitHub-hosted Agents
    vmImage: macos-26-arm64
  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false

  - template: /.azdo/common/set-variable-pats.yml

  - task: Cache@2
    displayName: Restore BuildXL cache
    inputs:
      key: '"buildxl-local-v1" | "$(Agent.OS)" | "$(qualifierArgument)" | "$(Build.SourceVersion)"'
      restoreKeys: |
        "buildxl-local-v1" | "$(Agent.OS)" | "$(qualifierArgument)"
      path: '$(Build.SourcesDirectory)/Out/Cache.noindex'
      cacheHitVar: BUILDXL_CACHE_RESTORED

  # Use a pipeline-specific 5 GiB cache instead of BuildXL's 10 GiB default to bound the
  # archive size transferred and retained by the Azure Pipelines Cache@2 task.
  - task: Bash@3
    displayName: Build and deploy BuildXL
    inputs:
      targetType: inline
      script: |
        set -eu

        machineArchitecture=$(uname -m)
        echo "Host architecture: $machineArchitecture"
        echo "Source revision: $(git rev-parse HEAD)"
        test "$machineArchitecture" = arm64

        bash bxl.sh \
          --internal \
          --deploy-dev \
          --cache-config-file "$(Build.SourcesDirectory)/.azdo/pr/macos-cache-config.json" \
          $(configurationArgument) \
          /sandboxKind:None \
          /useHistoricalRamUsageInfo- \
          /logsDirectory:"Out/Logs/Bootstrap" \
          /server-

        file Out/Selfhost/Dev/bxl | grep -q arm64
        codesign --verify --verbose=2 Out/Selfhost/Dev/bxl
      workingDirectory: $(Build.SourcesDirectory)
    env:
      PAT1esSharedAssets: $(BuildXL-Pipeline-AccessToken)
      PATCloudBuild: $(BuildXL-Pipeline-AccessToken)

  - task: Bash@3
    displayName: Run unit tests with deployed BuildXL
    inputs:
      targetType: inline
      script: |
        bash bxl.sh \
          --internal \
          --use-dev \
          --cache-config-file "$(Build.SourcesDirectory)/.azdo/pr/macos-cache-config.json" \
          $(configurationArgument) \
          $(qualifierArgument) \
          "/f:tag='test'" \
          /sandboxKind:None \
          /useHistoricalRamUsageInfo- \
          /logsDirectory:"Out/Logs/Tests" \
          /server-
      workingDirectory: $(Build.SourcesDirectory)
    env:
      PAT1esSharedAssets: $(BuildXL-Pipeline-AccessToken)
      PATCloudBuild: $(BuildXL-Pipeline-AccessToken)

  - task: PublishBuildArtifacts@1
    displayName: Publish BuildXL logs
    condition: always()
    inputs:
      PathtoPublish: $(Build.SourcesDirectory)/Out/Logs
      ArtifactName: macos-build-test-logs-$(Build.BuildId)-$(System.JobName)
      publishLocation: Container
