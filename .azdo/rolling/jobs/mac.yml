jobs:
- job: Mac_Packages
  displayName: macOS Package Build
  timeoutInMinutes: 180  
  pool:
    name: Azure Pipelines
    os: macOs
    vmImage: macos-latest

  templateContext:
    sdl:
      binskim:
        scanOutputDirectoryOnly: true
    outputParentDirectory: $(Agent.TempDirectory)/BuildXLMacOS
    outputs:
    - output: artifactsDrop
      displayName: Publish macOS packages to drop
      dropServiceURI: https://mseng.artifacts.visualstudio.com/DefaultCollection
      buildNumber: BuildXL/MacOS/Internal/Intermediate/$(Build.BuildNumber)/$(Build.BuildId)
      sourcePath: $(Agent.TempDirectory)/BuildXLMacOS/Out
      retentionDays: 5
      dropMetadataContainerName: DropMetadata-MacOS-Intermediate

    - output: pipelineArtifact
      displayName: Publish macOS BuildXL logs
      condition: always()
      continueOnError: true
      path: $(Build.SourcesDirectory)/Out/Logs/Build
      artifact: MacOSBuildLogs.$(Build.BuildNumber)
      sbomEnabled: false

  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false

  - template: /.azdo/common/set-variable-pats.yml

  - task: Bash@3
    displayName: Build native macOS ARM64 BuildXL package
    inputs:
      targetType: inline
      # Stateless macOS agents have no historical data, so cold RAM projections unnecessarily limit concurrency.
      script: >-
        set -eu

        bash bxl.sh --internal
        /q:ReleaseDotNetCoreMacArm64
        "/f:output='$(Build.SourcesDirectory)/Out/Bin/release/pkgs/BuildXL.osx-arm64.$(Build.BuildNumber).nupkg'"
        /p:Build.BuildId=$(Build.BuildNumber)
        /p:[BuildXL.Branding]SourceIdentification=$(Branding_SourceIdentification)
        /sandboxKind:None
        /useHistoricalRamUsageInfo-
        /logOutput:FullOutputOnError
        /logsDirectory:"Out/Logs/Build"
      workingDirectory: $(Build.SourcesDirectory)
    env:
      PAT1esSharedAssets: $(BuildXL-Pipeline-AccessToken)
      PATCloudBuild: $(BuildXL-Pipeline-AccessToken)

  - task: Bash@3
    displayName: Create Intermediate Build Directory
    inputs:
      targetType: inline
      script: |
        mkdir -p $(Agent.TempDirectory)/BuildXLMacOS/InteropLibrary
        rm -rf $(Agent.TempDirectory)/BuildXLMacOS/InteropLibrary/*
      workingDirectory: $(Agent.TempDirectory)
  
  - task: Bash@3
    displayName: Build Debug libBuildXLInterop.dylib
    inputs:
      filePath: $(Build.SourcesDirectory)/Private/macOS/xcodebuild.sh
      arguments: --projectPath $(Build.SourcesDirectory)/Public/Src/Sandbox/MacOs/Interop/Interop.xcodeproj --scheme InteropLibrary --configuration debug --outputDirectory $(Agent.TempDirectory)/BuildXLMacOS/InteropLibrary --bundlePath $(Build.SourcesDirectory)/Public/Src/Sandbox/MacOs/BundleInfo.xcconfig
      workingDirectory: $(Agent.TempDirectory)/BuildXLMacOS
  
  - task: Bash@3
    displayName: Build Release libBuildXLInterop.dylib
    inputs:
      filePath: $(Build.SourcesDirectory)/Private/macOS/xcodebuild.sh
      arguments: --projectPath $(Build.SourcesDirectory)/Public/Src/Sandbox/MacOs/Interop/Interop.xcodeproj --scheme InteropLibrary --configuration release --outputDirectory $(Agent.TempDirectory)/BuildXLMacOS/InteropLibrary --bundlePath $(Build.SourcesDirectory)/Public/Src/Sandbox/MacOs/BundleInfo.xcconfig
      workingDirectory: $(Agent.TempDirectory)/BuildXLMacOS
  
  - task: Bash@3
    displayName: Prepare Nuget Package
    inputs:
      filePath: $(Build.SourcesDirectory)/Private/macOS/prepare-macos-runtime-package.sh
      arguments: --packageVersion $(Build.BuildNumber) --interopBuildDirectory $(Agent.TempDirectory)/BuildXLMacOS/InteropLibrary --outputDirectory $(Agent.TempDirectory)/BuildXLMacOS/nugetpkg
      workingDirectory: $(Agent.TempDirectory)/BuildXLMacOS

  - powershell: |
      # Copy files to expected directory structure for drop
      New-Item -ItemType Directory -Path "$(Agent.TempDirectory)/BuildXLMacOS/Out/release/pkgs" -Force

      # Copy nuget package with file extension .nupkg from $(Agent.TempDirectory)/BuildXLMacOS/nugetpkg/ to $(Agent.TempDirectory)/BuildXLMacOS/Out/release/pkgs
      Get-ChildItem -Path "$(Agent.TempDirectory)/BuildXLMacOS/nugetpkg/" -Filter *.nupkg | Copy-Item -Destination "$(Agent.TempDirectory)/BuildXLMacOS/Out/release/pkgs" -Force
      Get-ChildItem -Path "$(Build.SourcesDirectory)/Out/Bin/release/pkgs/" -Filter BuildXL.osx-arm64.*.nupkg | Copy-Item -Destination "$(Agent.TempDirectory)/BuildXLMacOS/Out/release/pkgs" -Force
    displayName: 'Prepare macOS nuget package for drop'